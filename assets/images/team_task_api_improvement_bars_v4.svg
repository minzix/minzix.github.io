<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">업무 목록 API의 쿼리 수 및 p95 응답시간 개선 전후 비교</title>
  <desc id="desc">로컬 Docker, 약 240만 행. 업무 79개는 0.3 RPS에서 쿼리 160회에서 4회, p95 5,158ms에서 45.3ms. 업무 500개는 0.2 RPS에서 쿼리 1,002회에서 4회, p95 5,130.9ms에서 45.4ms. 각 그래프는 0을 기준으로 하는 선형 축을 사용합니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #52514e; font-size: 12px; }
    .heading { fill: #1f1e1d; font-size: 15px; font-weight: 600; }
    .before { fill: #faece7; stroke: #993c1d; stroke-width: .5; }
    .after { fill: #e1f5ee; stroke: #0f6e56; stroke-width: .5; }
    .axis { stroke: #888780; stroke-width: .5; }
    .grid { stroke: #e8e7e3; stroke-width: .5; }
  </style>
  <rect width="680" height="430" fill="#fff"/>
  <rect x="20" y="10" width="640" height="58" rx="6" fill="#f7f7f5"/>
  <text x="34" y="33">로컬 Docker, 약 240만 행의 더미 데이터</text>
  <text x="34" y="53">업무 79개: 0.3 RPS / 업무 500개: 0.2 RPS (각 조건에서 개선 전후 비교)</text>
  <text x="184" y="99" text-anchor="middle" class="heading">쿼리 수 (회)</text>
  <text x="503" y="99" text-anchor="middle" class="heading">p95 응답시간 (ms)</text>
  <path d="M64 135H305 M64 225H305 M385 135H635 M385 225H635" class="grid"/>
  <path d="M64 135V315H305 M385 135V315H635" class="axis" fill="none"/>
  <text x="57" y="319" text-anchor="end">0</text>
  <text x="57" y="229" text-anchor="end">550</text>
  <text x="57" y="139" text-anchor="end">1,100</text>
  <text x="378" y="319" text-anchor="end">0</text>
  <text x="378" y="229" text-anchor="end">2,750</text>
  <text x="378" y="139" text-anchor="end">5,500</text>
  <rect x="93" y="288.82" width="30" height="26.18" class="before"/>
  <rect x="137" y="314.35" width="30" height=".65" class="after"/>
  <text x="108" y="279" text-anchor="middle">160</text>
  <text x="152" y="303" text-anchor="middle">4</text>
  <rect x="208" y="151.04" width="30" height="163.96" class="before"/>
  <rect x="252" y="314.35" width="30" height=".65" class="after"/>
  <text x="223" y="141" text-anchor="middle">1,002</text>
  <text x="267" y="303" text-anchor="middle">4</text>
  <rect x="414" y="146.19" width="30" height="168.81" class="before"/>
  <rect x="458" y="313.52" width="30" height="1.48" class="after"/>
  <text x="429" y="136" text-anchor="middle">5,158</text>
  <text x="473" y="302" text-anchor="middle">45.3</text>
  <rect x="536" y="147.08" width="30" height="167.92" class="before"/>
  <rect x="580" y="313.51" width="30" height="1.49" class="after"/>
  <text x="551" y="137" text-anchor="middle">5,130.9</text>
  <text x="595" y="302" text-anchor="middle">45.4</text>
  <g text-anchor="middle">
    <text x="130" y="338">업무 79개</text><text x="245" y="338">업무 500개</text>
    <text x="451" y="338">업무 79개</text><text x="573" y="338">업무 500개</text>
    <text x="130" y="359">−97.5%</text><text x="245" y="359">−99.6%</text>
    <text x="451" y="359">−99.1%</text><text x="573" y="359">−99.1%</text>
  </g>
  <rect x="250" y="390" width="12" height="12" rx="2" class="before"/>
  <text x="270" y="400">개선 전</text>
  <rect x="355" y="390" width="12" height="12" rx="2" class="after"/>
  <text x="375" y="400">개선 후</text>
</svg>
